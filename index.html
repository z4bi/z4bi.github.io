<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tixidise accounts</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: url("images/bloxtoberbackground.png") center top / cover fixed no-repeat;
    color: #333;
}

.bloxtober-banner {
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
    text-align: center;
    overflow: hidden;
}

.bloxtober-banner img {
    display: block;
    width: 100%;
    height: 120px;
    object-fit: cover;
    margin: 0;
    padding: 0;
}

.page {
    width: 1080px;
    margin: 18px auto 60px;
}

.notice {
    background: #fff;
    border: 1px solid #c7c7c7;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    padding: 13px 16px;
    margin-bottom: 15px;
}

.notice-title {
    font-size: 20px;
    color: #555;
    font-weight: normal;
}

.notice-text {
    margin-top: 5px;
    color: #888;
    font-size: 12px;
}

.section {
    margin-bottom: 25px;
}

.section-title {
    background: linear-gradient(#f7f7f7, #dedede);
    border: 1px solid #c7c7c7;
    border-bottom: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    padding: 10px 13px;
    font-size: 18px;
    color: #555;
    font-weight: normal;
}

.account-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.account-card {
    background: #fff;
    border: 1px solid #c9c9c9;
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
    min-height: 350px;
    position: relative;
}

.card-header {
    height: 34px;
    background: linear-gradient(#f7f7f7, #dedede);
    border-bottom: 1px solid #c6c6c6;
    padding: 9px 10px;
    font-size: 13px;
    color: #444;
    font-weight: normal;
}

.avatar-area {
    height: 175px;
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.avatar-area img {
    max-width: 100%;
    max-height: 155px;
    object-fit: contain;
}

.avatar-fallback {
    color: #aaa;
    font-size: 12px;
}

.card-body {
    padding: 11px;
}

.account-age {
    color: #888;
    font-size: 13px;
    font-weight: normal;
    margin-left: 4px;
}

.description {
    color: #666;
    font-size: 12px;
    line-height: 1.4;
    height: 48px;
    overflow: hidden;
    margin-bottom: 9px;
}

.items-title {
    color: #555;
    font-size: 11px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
    margin-bottom: 7px;
}

.items {
    height: 55px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    overflow: hidden;
}

.item-image {
    width: 100%;
    height: 55px;
    object-fit: contain;
    background: #f5f5f5;
    border: 1px solid #ddd;
}

.card-footer {
    padding: 9px 11px 11px;
}

.profile-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(#f6a23a, #e47c17);
    border: 1px solid #bd5d08;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 8px 0;
    text-shadow: 1px 1px rgba(0,0,0,.35);
    box-shadow: inset 0 1px rgba(255,255,255,.35);
}

.profile-button:hover {
    background: linear-gradient(#ffad48, #eb861d);
}

.empty {
    background: white;
    border: 1px solid #ccc;
    padding: 35px;
    text-align: center;
    color: #999;
    grid-column: 1 / -1;
}

@media(max-width: 1100px) {
    .page {
        width: calc(100% - 30px);
    }

    .account-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 800px) {
    .account-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 520px) {
    .account-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="bloxtober-banner">
    <img src="https://github.com/z4bi/z4bi.github.io/blob/main/images/bloxtoberbanner1.png" alt="Bloxtober">
</div>

<div class="page">

    <div class="notice">
        <div class="notice-title">Tixidise's Accounts</div>
        <div class="notice-text">
            all of my accounts including limiteds and offsales and usernames
        </div>
    </div>

    <div class="section">
        <div class="section-title">Random?</div>
        <div id="offsalesGrid" class="account-grid"></div>
    </div>

    <div class="section">
        <div class="section-title">Limiteds</div>
        <div id="limitedsGrid" class="account-grid"></div>
    </div>

    <div class="section">
        <div class="section-title">Stacked</div>
        <div id="stackedGrid" class="account-grid"></div>
    </div>

</div>

<script>
const offsales = [
    "Tixidise|2011|https://tr.rbxcdn.com/30DAY-Avatar-FD6AEDE1CADBCEAF3AC4275693A2BCCC-Png/720/720/Avatar/Webp/noFilter|https://www.roblox.com/users/14759501/profile|2011 dev account with 140K+ Total place visits red sparkle time bandana (8000 robux item) and sleek sunglasses (1500)|https://tr.rbxcdn.com/180DAY-3846a4470225946a33e14289ef93dc8b/420/420/FaceAccessory/Webp/noFilter|https://tr.rbxcdn.com/180DAY-37b4d0d1afcbd09026e073bfacff028e/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-f5b04f88662ff71f3938e1937f106fdd/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-f953ff72160d14bae156849899427f38/420/420/FaceAccessory/Webp/noFilter",
];

const limiteds = [
];

const stacked = [
    "7ZPM|2020|https://tr.rbxcdn.com/30DAY-Avatar-BE473F6A5D68A8A1C7228705494E3F2B-Png/720/720/Avatar/Webp/noFilter|https://www.roblox.com/users/1449259706/profile|stacked as nigger 2020 account with 10 pages of hats and like all 2020 eggs and lots of toycodes including ones 80$+ ig|https://tr.rbxcdn.com/180DAY-2c7e6a5cbeec6ea6a43548815a041e32/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-213f6296a789c14d96db49dede934864/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-978e2126a665d07120c2c7574b40074e/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/30DAY-Avatar-07F04DFE1A83E66342DB8EA4F764C43E-Png/420/420/Avatar/Webp/noFilter",
    "Reset2241079294|2020|https://tr.rbxcdn.com/30DAY-Avatar-0393A899BAE342C1F2C26CA56D1DE07B-Png/720/720/Avatar/Webp/noFilter|https://www.roblox.com/users/2241079294/profile|stacked 2020 with like 10 items that are atleast 1000+ robux has sparkle time bundle, just lots of fucken expensive robux items|https://tr.rbxcdn.com/30DAY-Avatar-C781BF593233D0822D2464A4FAC53220-Png/420/420/Avatar/Webp/noFilter|https://tr.rbxcdn.com/180DAY-0413a25153483792f0bce947e9f922e5/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-2096cdf64fcf0bb3cfca584bdb95fd6a/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-f953ff72160d14bae156849899427f38/420/420/FaceAccessory/Webp/noFilter",
    "ROBLOXianEnergyCore|2013|https://tr.rbxcdn.com/30DAY-Avatar-BD8E21229BDCC91D5E24AFF49CCAA4FF-Png/720/720/Avatar/Webp/noFilter|https://www.roblox.com/users/40922102/profile|stacked 2013 account 5 pages of hats with full 2017 egg hunt completed 5 different visors|https://tr.rbxcdn.com/180DAY-70f03940f4ab6301fd1fcab0a981bd9e/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-fda94fe4d563891730a5cda00c1da675/420/420/Hat/Webp/noFilter|https://tr.rbxcdn.com/180DAY-6f7e94f24e6e5f1856ecf59e9d962a62/420/420/Gear/Webp/noFilter|https://tr.rbxcdn.com/180DAY-37b4d0d1afcbd09026e073bfacff028e/420/420/Hat/Webp/noFilter",
];

function renderAccounts(accounts, gridId) {
    const grid = document.getElementById(gridId);

    if (!accounts.length) {
        grid.innerHTML = '<div class="empty">no accounts here yet... :/</div>';
        return;
    }

    grid.innerHTML = "";

    accounts.forEach(account => {
        const data = account.split("|");

        const name = data[0] || "";
        const age = data[1] || "";
        const image = data[2] || "";
        const profile = data[3] || "";
        const description = data[4] || "";
        const item1 = data[5] || "";
        const item2 = data[6] || "";
        const item3 = data[7] || "";
        const item4 = data[8] || "";

        const card = document.createElement("div");

        card.className = "account-card";

        card.innerHTML = `
            <div class="card-header">
                ${escapeHTML(name)}
                <span class="account-age">(${escapeHTML(age)})</span>
            </div>

            <div class="avatar-area">
                <img src="${escapeAttribute(image)}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

                <div class="avatar-fallback" style="display:none;">
                    Image unavailable
                </div>
            </div>

            <div class="card-body">

                <div class="description">
                    ${escapeHTML(description)}
                </div>

                <div class="items-title">
                    WHAT IT HAS
                </div>

                <div class="items">
                    <img class="item-image" src="${escapeAttribute(item1)}" onerror="this.style.visibility='hidden';">
                    <img class="item-image" src="${escapeAttribute(item2)}" onerror="this.style.visibility='hidden';">
                    <img class="item-image" src="${escapeAttribute(item3)}" onerror="this.style.visibility='hidden';">
                    <img class="item-image" src="${escapeAttribute(item4)}" onerror="this.style.visibility='hidden';">
                </div>

            </div>

            <div class="card-footer">
                <a class="profile-button"
                   href="${escapeAttribute(profile)}"
                   target="_blank">
                    View Profile
                </a>
            </div>
        `;

        grid.appendChild(card);
    });
}

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

renderAccounts(offsales, "offsalesGrid");
renderAccounts(limiteds, "limitedsGrid");
renderAccounts(stacked, "stackedGrid");
</script>

</body>
</html>
