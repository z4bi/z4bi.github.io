<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tixidise accounts</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: url("images/bloxtoberbackground.png") center top / cover fixed no-repeat;
    color: #333;
}

.bloxtober-banner {
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
    text-align: center;
    overflow: hidden;
}

.bloxtober-banner img {
    display: block;
    width: 100%;
    height: 20%;
    margin: 0;
    padding: 0;
}

.page {
    width: 1080px;
    margin: 18px auto 60px;
}

.notice {
    background: #fff;
    border: 1px solid #c7c7c7;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    padding: 13px 16px;
    margin-bottom: 15px;
}

.notice-title {
    font-size: 20px;
    color: #555;
    font-weight: normal;
}

.notice-text {
    margin-top: 5px;
    color: #888;
    font-size: 12px;
}

.section {
    margin-bottom: 25px;
}

.section-title {
    background: linear-gradient(#f7f7f7, #dedede);
    border: 1px solid #c7c7c7;
    border-bottom: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    padding: 10px 13px;
    font-size: 18px;
    color: #555;
    font-weight: normal;
}

.account-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.account-card {
    background: #fff;
    border: 1px solid #c9c9c9;
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
    min-height: 350px;
    position: relative;
}

.card-header {
    height: 34px;
    background: linear-gradient(#f7f7f7, #dedede);
    border-bottom: 1px solid #c6c6c6;
    padding: 9px 10px;
    font-size: 13px;
    color: #444;
    font-weight: bold;
}

.avatar-area {
    height: 175px;
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.avatar-area img {
    max-width: 100%;
    max-height: 155px;
    object-fit: contain;
}

.avatar-fallback {
    color: #aaa;
    font-size: 12px;
}

.card-body {
    padding: 11px;
}

.username {
    color: #1769aa;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.account-age {
    color: #888;
    font-size: 13px;
    font-weight: normal;
    margin-left: 4px;
}

.description {
    color: #666;
    font-size: 12px;
    line-height: 1.4;
    height: 48px;
    overflow: hidden;
    margin-bottom: 9px;
}

.items-title {
    color: #555;
    font-size: 11px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
    margin-bottom: 5px;
}

.items {
    height: 40px;
    overflow: hidden;
    color: #888;
    font-size: 11px;
    line-height: 1.4;
}

.card-footer {
    padding: 9px 11px 11px;
}

.profile-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(#f6a23a, #e47c17);
    border: 1px solid #bd5d08;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 8px 0;
    text-shadow: 1px 1px rgba(0,0,0,.35);
    box-shadow: inset 0 1px rgba(255,255,255,.35);
}

.profile-button:hover {
    background: linear-gradient(#ffad48, #eb861d);
}

.empty {
    background: white;
    border: 1px solid #ccc;
    padding: 35px;
    text-align: center;
    color: #999;
    grid-column: 1 / -1;
}

@media(max-width: 1100px) {
    .page {
        width: calc(100% - 30px);
    }

    .account-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 800px) {
    .account-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 520px) {
    .account-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="bloxtober-banner">
    <img src="images/bloxtoberbanner.png" alt="Bloxtober">
</div>

<div class="page">

    <div class="notice">
        <div class="notice-title">Tixidise's Accounts</div>
        <div class="notice-text">
            all of my accounts including limiteds and offsales and usernames
        </div>
    </div>

    <div class="section">
        <div class="section-title">Offsales</div>
        <div id="offsalesGrid" class="account-grid"></div>
    </div>

    <div class="section">
        <div class="section-title">Limiteds</div>
        <div id="limitedsGrid" class="account-grid"></div>
    </div>

    <div class="section">
        <div class="section-title">Stacked</div>
        <div id="stackedGrid" class="account-grid"></div>
    </div>

</div>

<script>
const offsales = [
    // "Account Name|2013|Image URL|Profile URL|Description|What it has"
];

const limiteds = [
    // "Account Name|2013|Image URL|Profile URL|Description|What it has"
];

const stacked = [
    // "Account Name|2013|Image URL|Profile URL|Description|What it has"
];

function renderAccounts(accounts, gridId) {
    const grid = document.getElementById(gridId);

    if (!accounts.length) {
        grid.innerHTML = '<div class="empty">No accounts added yet.</div>';
        return;
    }

    grid.innerHTML = "";

    accounts.forEach(account => {
        const data = account.split("|");

        const name = data[0] || "";
        const age = data[1] || "";
        const image = data[2] || "";
        const profile = data[3] || "";
        const description = data[4] || "";
        const items = data[5] || "";

        const card = document.createElement("div");

        card.className = "account-card";

        card.innerHTML = `
            <div class="card-header">
                Account Profile
            </div>

            <div class="avatar-area">
                <img src="${escapeAttribute(image)}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

                <div class="avatar-fallback" style="display:none;">
                    Image unavailable
                </div>
            </div>

            <div class="card-body">

                <div class="username">
                    ${escapeHTML(name)}
                    <span class="account-age">(${escapeHTML(age)})</span>
                </div>

                <div class="description">
                    ${escapeHTML(description)}
                </div>

                <div class="items-title">
                    WHAT IT HAS
                </div>

                <div class="items">
                    ${escapeHTML(items)}
                </div>

            </div>

            <div class="card-footer">
                <a class="profile-button"
                   href="${escapeAttribute(profile)}"
                   target="_blank">
                    View Profile
                </a>
            </div>
        `;

        grid.appendChild(card);
    });
}

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

renderAccounts(offsales, "offsalesGrid");
renderAccounts(limiteds, "limitedsGrid");
renderAccounts(stacked, "stackedGrid");
</script>

</body>
</html>
