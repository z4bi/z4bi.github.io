<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tixidise accounts</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: url("images/bloxtoberbackground.png") center top / cover fixed no-repeat;
    color: #333;
}

.bloxtober-banner {
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
    text-align: center;
    overflow: hidden;
}

.bloxtober-banner img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
}

.page {
    width: 1080px;
    margin: 18px auto 60px;
}

.notice {
    background: #fff;
    border: 1px solid #c7c7c7;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    padding: 13px 16px;
    margin-bottom: 15px;
}

.notice-title {
    font-size: 20px;
    color: #555;
    font-weight: normal;
}

.notice-text {
    margin-top: 5px;
    color: #888;
    font-size: 12px;
}

.toolbar {
    background: #f5f5f5;
    border: 1px solid #c7c7c7;
    padding: 9px;
    margin-bottom: 15px;
}

.add-button {
    background: linear-gradient(#f6a23a, #e47c17);
    border: 1px solid #bd5d08;
    color: white;
    font-weight: bold;
    font-size: 13px;
    padding: 8px 15px;
    border-radius: 3px;
    text-shadow: 1px 1px rgba(0,0,0,.35);
    cursor: pointer;
    box-shadow: inset 0 1px rgba(255,255,255,.35);
}

.add-button:hover {
    background: linear-gradient(#ffad48, #eb861d);
}

.account-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.account-card {
    background: #fff;
    border: 1px solid #c9c9c9;
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
    min-height: 350px;
    position: relative;
}

.card-header {
    height: 34px;
    background: linear-gradient(#f7f7f7, #dedede);
    border-bottom: 1px solid #c6c6c6;
    padding: 9px 10px;
    font-size: 13px;
    color: #444;
    font-weight: bold;
}

.avatar-area {
    height: 175px;
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.avatar-area img {
    max-width: 100%;
    max-height: 155px;
    object-fit: contain;
}

.avatar-fallback {
    color: #aaa;
    font-size: 12px;
}

.card-body {
    padding: 11px;
}

.username {
    color: #1769aa;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.description {
    color: #666;
    font-size: 12px;
    line-height: 1.4;
    height: 48px;
    overflow: hidden;
    margin-bottom: 9px;
}

.items-title {
    color: #555;
    font-size: 11px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
    margin-bottom: 5px;
}

.items {
    height: 40px;
    overflow: hidden;
    color: #888;
    font-size: 11px;
    line-height: 1.4;
}

.card-footer {
    padding: 9px 11px 11px;
}

.profile-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(#f6a23a, #e47c17);
    border: 1px solid #bd5d08;
    border-radius: 3px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 8px 0;
    text-shadow: 1px 1px rgba(0,0,0,.35);
    box-shadow: inset 0 1px rgba(255,255,255,.35);
}

.profile-button:hover {
    background: linear-gradient(#ffad48, #eb861d);
}

.delete-button {
    position: absolute;
    right: 6px;
    top: 7px;
    border: 0;
    background: transparent;
    color: #999;
    font-size: 13px;
    cursor: pointer;
}

.delete-button:hover {
    color: #d00;
}

.empty {
    background: white;
    border: 1px solid #ccc;
    padding: 35px;
    text-align: center;
    color: #999;
    grid-column: 1 / -1;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 20;
}

.modal {
    width: 470px;
    background: #eee;
    border: 1px solid #222;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.modal-header {
    height: 38px;
    background: linear-gradient(#444, #222);
    color: white;
    font-size: 14px;
    font-weight: bold;
    padding: 11px 13px;
}

.close {
    float: right;
    cursor: pointer;
    color: #ccc;
    font-size: 16px;
}

.close:hover {
    color: white;
}

.modal-body {
    padding: 16px;
    background: #f5f5f5;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #555;
    margin-bottom: 5px;
}

.field input,
.field textarea {
    width: 100%;
    border: 1px solid #aaa;
    background: white;
    padding: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    outline: none;
}

.field input:focus,
.field textarea:focus {
    border-color: #777;
}

.field textarea {
    resize: vertical;
    min-height: 65px;
}

.modal-footer {
    padding: 10px 16px 15px;
    background: #f5f5f5;
    text-align: right;
}

.cancel {
    border: 1px solid #aaa;
    background: linear-gradient(#fff, #ddd);
    padding: 8px 13px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 5px;
}

.save {
    border: 1px solid #bd5d08;
    background: linear-gradient(#f6a23a, #e47c17);
    color: white;
    font-weight: bold;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    text-shadow: 1px 1px rgba(0,0,0,.3);
}

.footer {
    width: 1080px;
    margin: 25px auto;
    color: #888;
    font-size: 11px;
    text-align: center;
}

@media(max-width: 1100px) {
    .page,
    .footer {
        width: calc(100% - 30px);
    }

    .account-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 800px) {
    .account-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 520px) {
    .account-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="bloxtober-banner">
    <img src="images/bloxtoberbanner.png" alt="Bloxtober">
</div>

<div class="page">

    <div class="notice">
        <div class="notice-title">2013 Accounts</div>
        <div class="notice-text">
            A collection of classic Roblox accounts and their items.
        </div>
    </div>

    <div class="toolbar">
        <button class="add-button" onclick="openModal()">Add Account</button>
    </div>

    <div id="accountGrid" class="account-grid"></div>

</div>

<div class="footer">
    ROBLOX Account Gallery &nbsp;|&nbsp; 2013 Archive
</div>

<div id="overlay" class="overlay">

    <div class="modal">

        <div class="modal-header">
            Add Account
            <span class="close" onclick="closeModal()">×</span>
        </div>

        <div class="modal-body">

            <div class="field">
                <label>Account Name</label>
                <input id="accountName" type="text" placeholder="Example: Builderman">
            </div>

            <div class="field">
                <label>Image URL</label>
                <input id="accountImage" type="text" placeholder="https://example.com/avatar.png">
            </div>

            <div class="field">
                <label>Profile URL</label>
                <input id="accountProfile" type="text" placeholder="https://www.roblox.com/users/1/profile">
            </div>

            <div class="field">
                <label>Description</label>
                <textarea id="accountDescription" placeholder="Describe the account..."></textarea>
            </div>

            <div class="field">
                <label>What it has</label>
                <textarea id="accountItems" placeholder="Example: Classic hats, badges, limiteds..."></textarea>
            </div>

        </div>

        <div class="modal-footer">
            <button class="cancel" onclick="closeModal()">Cancel</button>
            <button class="save" onclick="saveAccount()">Add Account</button>
        </div>

    </div>

</div>

<script>
const defaultAccounts = [];

function getAccounts() {
    const saved = localStorage.getItem("roblox2013Accounts");

    if (!saved) {
        localStorage.setItem("roblox2013Accounts", JSON.stringify(defaultAccounts));
        return defaultAccounts;
    }

    try {
        return JSON.parse(saved);
    } catch {
        return [];
    }
}

function saveAccounts(accounts) {
    localStorage.setItem("roblox2013Accounts", JSON.stringify(accounts));
}

function renderAccounts() {
    const grid = document.getElementById("accountGrid");
    const accounts = getAccounts();

    grid.innerHTML = "";

    if (!accounts.length) {
        grid.innerHTML = '<div class="empty">No accounts have been added yet.</div>';
        return;
    }

    accounts.forEach((account, index) => {
        const card = document.createElement("div");

        card.className = "account-card";

        card.innerHTML = `
            <button class="delete-button" onclick="deleteAccount(${index})">×</button>

            <div class="card-header">
                Account Profile
            </div>

            <div class="avatar-area">
                <img src="${escapeAttribute(account.image)}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

                <div class="avatar-fallback" style="display:none;">
                    Image unavailable
                </div>
            </div>

            <div class="card-body">

                <div class="username">
                    ${escapeHTML(account.name)}
                </div>

                <div class="description">
                    ${escapeHTML(account.description)}
                </div>

                <div class="items-title">
                    WHAT IT HAS
                </div>

                <div class="items">
                    ${escapeHTML(account.items)}
                </div>

            </div>

            <div class="card-footer">
                <a class="profile-button"
                   href="${escapeAttribute(account.profile)}"
                   target="_blank">
                    View Profile
                </a>
            </div>
        `;

        grid.appendChild(card);
    });
}

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

function openModal() {
    document.getElementById("overlay").style.display = "block";
    document.getElementById("accountName").focus();
}

function closeModal() {
    document.getElementById("overlay").style.display = "none";

    document.getElementById("accountName").value = "";
    document.getElementById("accountImage").value = "";
    document.getElementById("accountProfile").value = "";
    document.getElementById("accountDescription").value = "";
    document.getElementById("accountItems").value = "";
}

function saveAccount() {
    const name = document.getElementById("accountName").value.trim();
    const image = document.getElementById("accountImage").value.trim();
    const profile = document.getElementById("accountProfile").value.trim();
    const description = document.getElementById("accountDescription").value.trim();
    const items = document.getElementById("accountItems").value.trim();

    if (!name || !image || !profile) {
        alert("Please enter an account name, image URL, and profile URL.");
        return;
    }

    const accounts = getAccounts();

    accounts.push({
        name: name,
        image: image,
        profile: profile,
        description: description,
        items: items
    });

    saveAccounts(accounts);
    closeModal();
    renderAccounts();
}

function deleteAccount(index) {
    const accounts = getAccounts();

    if (!confirm("Remove this account from the gallery?")) {
        return;
    }

    accounts.splice(index, 1);

    saveAccounts(accounts);
    renderAccounts();
}

document.getElementById("overlay").addEventListener("click", function(event) {
    if (event.target === this) {
        closeModal();
    }
});

renderAccounts();
</script>

</body>
</html>
